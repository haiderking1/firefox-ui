// firefox-ui loader. Firefox skips the first line of this file, keep this comment.
//
// Runs every *.uc.js file in the profile's chrome/ folder in each browser
// window, in name order. Installed into Firefox's install dir by
// install-autoconfig.sh, together with defaults/pref/firefox-ui-autoconfig.js.

try {
  const loadScripts = win => {
    const dir = Services.dirsvc.get("UChrm", Components.interfaces.nsIFile);
    if (!dir.exists()) {
      return;
    }
    const files = [];
    for (const file of dir.directoryEntries) {
      if (file.leafName.endsWith(".uc.js")) {
        files.push(file);
      }
    }
    files.sort((a, b) => a.leafName.localeCompare(b.leafName));
    // loadSubScript refuses file:// URLs ("untrusted URI"), so serve the
    // folder as resource://firefox-ui/ instead
    Services.io
      .getProtocolHandler("resource")
      .QueryInterface(Components.interfaces.nsIResProtocolHandler)
      .setSubstitution("firefox-ui", Services.io.newFileURI(dir));
    for (const file of files) {
      try {
        Services.scriptloader.loadSubScriptWithOptions(`resource://firefox-ui/${file.leafName}`, {
          target: win,
          ignoreCache: true,
        });
      } catch (e) {
        // (no `console` in this scope, the window's works)
        win.console.error(`firefox-ui: ${file.leafName} failed`, e);
      }
    }
  };

  // Fires right before the window is first shown, so nothing pops in late
  Services.obs.addObserver(win => loadScripts(win), "browser-window-before-show");
} catch (e) {
  Services.console.logStringMessage(`firefox-ui: loader failed: ${e}`);
}
